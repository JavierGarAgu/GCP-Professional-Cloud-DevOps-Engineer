apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example
  namespace: prometheus-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-example
  template:
    metadata:
      labels:
        app: prometheus-example
    spec:
      containers:
      - name: metrics
        image: quay.io/brancz/prometheus-example-app:v0.3.0
        ports:
        - containerPort: 8080
          name: metrics

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example
  namespace: prometheus-demo
spec:
  selector:
    app: prometheus-example
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080